<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucks2Bar</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Bucks2Bar</h1>

      <ul class="nav nav-tabs" id="bucks2bar-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="data-tab"
            data-bs-toggle="tab"
            data-bs-target="#data-pane"
            type="button"
            role="tab"
            aria-controls="data-pane"
            aria-selected="true"
          >
            Data
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="chart-tab"
            data-bs-toggle="tab"
            data-bs-target="#chart-pane"
            type="button"
            role="tab"
            aria-controls="chart-pane"
            aria-selected="false"
          >
            Chart
          </button>
        </li>
      </ul>

      <div
        class="tab-content border border-top-0 p-3"
        id="bucks2bar-tab-content"
      >
        <div
          class="tab-pane fade show active"
          id="data-pane"
          role="tabpanel"
          aria-labelledby="data-tab"
        >
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Month</th>
                <th scope="col">Income (Php)</th>
                <th scope="col">Expense (Php)</th>
              </tr>
            </thead>
            <tbody id="months-table-body">
              <!-- Rows are generated by index.js for each month -->
            </tbody>
          </table>
        </div>
        <div
          class="tab-pane fade"
          id="chart-pane"
          role="tabpanel"
          aria-labelledby="chart-tab"
        >
          <canvas id="bucks2bar-chart" height="100"></canvas>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
