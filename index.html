<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucks2Bar</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Bucks2Bar</h1>

      <div class="mb-4">
        <label for="username-input" class="form-label">Username</label>
        <input
          type="text"
          class="form-control"
          id="username-input"
          placeholder="Enter username"
        />
        <div class="form-text">
          Must be at least 5 characters long and include 1 uppercase letter, 1
          number, and 1 special character.
        </div>
        <div class="invalid-feedback" id="username-feedback">
          Username does not meet the requirements.
        </div>
        <button
          type="button"
          id="username-submit-btn"
          class="btn text-white mt-2"
          style="background-color: deeppink"
        >
          Submit
        </button>
      </div>

      <ul class="nav nav-tabs" id="bucks2bar-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="data-tab"
            data-bs-toggle="tab"
            data-bs-target="#data-pane"
            type="button"
            role="tab"
            aria-controls="data-pane"
            aria-selected="true"
          >
            Data
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="chart-tab"
            data-bs-toggle="tab"
            data-bs-target="#chart-pane"
            type="button"
            role="tab"
            aria-controls="chart-pane"
            aria-selected="false"
          >
            Chart
          </button>
        </li>
      </ul>

      <div
        class="tab-content border border-top-0 p-3"
        id="bucks2bar-tab-content"
      >
        <div
          class="tab-pane fade show active"
          id="data-pane"
          role="tabpanel"
          aria-labelledby="data-tab"
        >
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Month</th>
                <th scope="col">Income (Php)</th>
                <th scope="col">Expense (Php)</th>
              </tr>
            </thead>
            <tbody id="months-table-body">
              <!-- Rows are generated by index.js for each month -->
            </tbody>
          </table>
        </div>
        <div
          class="tab-pane fade"
          id="chart-pane"
          role="tabpanel"
          aria-labelledby="chart-tab"
        >
          <div class="d-flex justify-content-end mb-2">
            <button
              type="button"
              id="download-chart-btn"
              class="btn text-white"
              style="background-color: deeppink"
            >
              Download
            </button>
          </div>
          <div style="min-height: 400px">
            <canvas id="bucks2bar-chart" height="100"></canvas>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
